# project.yml
name: metronome
options:
  bundleIdPrefix: dev.mongmeo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Atomics:
    url: https://github.com/apple/swift-atomics.git
    from: 1.2.0
targets:
  metronome:
    type: application
    platform: macOS
    sources:
      - metronome
    dependencies:
      - package: Atomics
        product: Atomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mongmeo.metronome
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
  metronomeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - metronomeTests
    dependencies:
      - target: metronome
      - package: Atomics
        product: Atomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mongmeo.metronomeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  metronome:
    build:
      targets:
        metronome: all
        metronomeTests: [test]
    test:
      targets:
        - metronomeTests
