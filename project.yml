# project.yml
name: mactronome
options:
  bundleIdPrefix: dev.mongmeo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  GitHubRelease: release
packages:
  Atomics:
    url: https://github.com/apple/swift-atomics.git
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  mactronome:
    type: application
    platform: macOS
    sources:
      - mactronome
    dependencies:
      - package: Atomics
        product: Atomics
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mongmeo.mactronome
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: mactronome/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          DEVELOPMENT_TEAM: 3Y3GN487QP
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "3rd Party Mac Developer Application: HONGDAE KIM (3Y3GN487QP)"
          PROVISIONING_PROFILE_SPECIFIER: MAC_APP_STORE-20260819
          CODE_SIGN_ENTITLEMENTS: mactronome/mactronome.entitlements
        GitHubRelease:
          DEVELOPMENT_TEAM: 3Y3GN487QP
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: HONGDAE KIM (3Y3GN487QP)"
          CODE_SIGN_ENTITLEMENTS: mactronome/mactronome.entitlements
  mactronomeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - mactronomeTests
    dependencies:
      - target: mactronome
      - package: Atomics
        product: Atomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mongmeo.mactronomeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  mactronome:
    build:
      targets:
        mactronome: all
        mactronomeTests: [test]
    test:
      targets:
        - mactronomeTests
